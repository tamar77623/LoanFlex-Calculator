<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>LoanFlex Calculator</title>
</head>
<body class="bg-slate-950 m-0 p-0">
    <body class="bg-gradient-to-br from-slate-950 via-slate-900 to-slate-950 min-h-screen m-0 p-0">
        <div class="container bg-slate-900/80 backdrop-blur-2xl p-6 my-12 mx-auto w-80 rounded-3xl shadow-[0_30px_100px_rgba(0,0,0,0.5)] border border-slate-700/50" id="contanier">
            <input type="number" id="inp1" placeholder="Property amount" class="bg-slate-950/70 text-white placeholder:text-slate-500 block my-4 mx-auto p-3.5 w-72 rounded-2xl font-semibold border border-slate-700/60 shadow-inner outline-none transition-all duration-300 focus:border-blue-500 focus:ring-4 focus:ring-blue-500/10 focus:bg-slate-950 hover:border-slate-600">
            <input type="number" id="inp2" placeholder="First payment (down payment)" class="bg-slate-950/70 text-white placeholder:text-slate-500 block my-4 mx-auto p-3.5 w-72 rounded-2xl font-semibold border border-slate-700/60 shadow-inner outline-none transition-all duration-300 focus:border-blue-500 focus:ring-4 focus:ring-blue-500/10 focus:bg-slate-950 hover:border-slate-600">
            <input type="number" id="inp3" placeholder="Annual Interest Rate (%)" class="bg-slate-950/70 text-white placeholder:text-slate-500 block my-4 mx-auto p-3.5 w-72 rounded-2xl font-semibold border border-slate-700/60 shadow-inner outline-none transition-all duration-300 focus:border-blue-500 focus:ring-4 focus:ring-blue-500/10 focus:bg-slate-950 hover:border-slate-600">
            <input type="number" id="inp4" placeholder="Loan term in years" class="bg-slate-950/70 text-white placeholder:text-slate-500 block my-4 mx-auto p-3.5 w-72 rounded-2xl font-semibold border border-slate-700/60 shadow-inner outline-none transition-all duration-300 focus:border-blue-500 focus:ring-4 focus:ring-blue-500/10 focus:bg-slate-950 hover:border-slate-600">
            <input type="number" id="inp5" placeholder="Monthly salary" class="bg-slate-950/70 text-white placeholder:text-slate-500 block my-4 mx-auto p-3.5 w-72 rounded-2xl font-semibold border border-slate-700/60 shadow-inner outline-none transition-all duration-300 focus:border-blue-500 focus:ring-4 focus:ring-blue-500/10 focus:bg-slate-950 hover:border-slate-600">
            <button id="btn" class="bg-gradient-to-r from-blue-600 via-indigo-600 to-violet-600 hover:from-blue-500 hover:via-indigo-500 hover:to-violet-500 active:scale-[0.97] text-white block w-full my-6 mx-auto rounded-2xl font-bold p-3.5 shadow-xl shadow-blue-950/40 border border-blue-400/20 transition-all duration-300">Account</button>
            <h3 class="text-center text-slate-200 font-bold m-4 text-xl capitalize" id="h3"></h3>
            <span id="span1" class="text-center text-slate-300 font-semibold m-2 capitalize block"></span>
            <span id="span2" class="text-center text-slate-300 font-semibold m-2 capitalize block"></span>
            <span id="span3" class="text-center text-slate-300 font-semibold m-2 capitalize block"></span>
            <span id="span4" class="text-center text-slate-300 font-semibold m-2 capitalize block"></span>
            <span id="span5" class="text-center text-slate-300 font-semibold m-2 capitalize block"></span>
            <span id="span6" class="text-center text-slate-300 font-semibold m-2 capitalize block"></span>
        </div>
    </body>
<script src="main.js"></script>
</html>
